<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kassen-App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 32px;
            border-bottom: 4px solid #667eea;
            padding-bottom: 15px;
        }

        h3 {
            color: #555;
            margin-top: 20px;
            margin-bottom: 15px;
            font-size: 22px;
            font-weight: bold;
        }

        .product-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .product-item {
            display: grid;
            grid-template-columns: 1fr 1fr 0.4fr;
            gap: 10px;
            align-items: center;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 8px;
            border: 2px solid #ddd;
        }

        .product-item input {
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 5px;
            font-size: 18px;
        }

        .product-item button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        .product-item button:hover {
            background: #ff5252;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn-product {
            padding: 25px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            background: #667eea;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .btn-product:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-product:active {
            transform: scale(0.95);
        }

        .btn-product .name {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .btn-product .price {
            font-size: 18px;
            opacity: 0.9;
        }

        .display {
            background: #333;
            color: #0f0;
            padding: 25px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            margin-bottom: 20px;
            min-height: 100px;
            font-size: 28px;
            text-align: center;
            word-wrap: break-word;
            font-weight: bold;
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .input-group input {
            flex: 1;
            min-width: 150px;
            padding: 18px;
            border: 3px solid #667eea;
            border-radius: 8px;
            font-size: 24px;
        }

        .input-group button {
            padding: 18px 35px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 20px;
            min-width: 120px;
        }

        .input-group button:hover {
            background: #764ba2;
        }

        .quick-buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-quick {
            padding: 20px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 20px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .btn-quick:hover {
            background: #e68900;
            transform: scale(1.05);
        }

        .btn-quick:active {
            transform: scale(0.95);
        }

        .result {
            background: #e8f5e9;
            padding: 25px;
            border-radius: 8px;
            border-left: 6px solid #4caf50;
            font-size: 24px;
            text-align: center;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-weight: bold;
        }

        .result.error {
            background: #ffebee;
            border-left-color: #f44336;
            color: #c62828;
        }

        .reset-btn {
            width: 100%;
            padding: 18px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 20px;
            margin-top: 15px;
        }

        .reset-btn:hover {
            background: #e68900;
        }

        .save-btn {
            width: 100%;
            padding: 18px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 15px;
        }

        .save-btn:hover {
            background: #45a049;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            .buttons-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .btn-product {
                min-height: 100px;
                font-size: 18px;
                padding: 20px;
            }

            h2 {
                font-size: 26px;
            }

            h3 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Linke Seite: Produkte einstellen -->
        <div class="section">
            <h2>⚙️ Produkte einstellen</h2>
            <button class="save-btn" onclick="saveProducts()">💾 Speichern</button>
            
            <div class="product-list" id="productList"></div>
            
            <button class="reset-btn" onclick="resetToDefault()">↻ Zurücksetzen</button>
        </div>

        <!-- Rechte Seite: Kasse -->
        <div class="section">
            <h2>💰 Kasse</h2>
            
            <div class="display" id="display">Wähle ein Produkt</div>

            <h3>Produkte wählen:</h3>
            <div class="buttons-grid" id="buttonsGrid"></div>

            <h3>💵 Geld eingeben:</h3>
            <div class="quick-buttons">
                <button class="btn-quick" onclick="quickInput(0.50)">0.50€</button>
                <button class="btn-quick" onclick="quickInput(1.00)">1.00€</button>
                <button class="btn-quick" onclick="quickInput(1.50)">1.50€</button>
                <button class="btn-quick" onclick="quickInput(2.00)">2.00€</button>
                <button class="btn-quick" onclick="quickInput(2.50)">2.50€</button>
            </div>

            <div class="input-group">
                <input type="number" id="paymentInput" placeholder="oder Geld eingeben" step="0.01" min="0">
                <button onclick="calculateChange()">Berechnen</button>
            </div>

            <div class="result" id="result"></div>

            <button class="reset-btn" onclick="resetCash()">🔄 Zurücksetzen</button>
        </div>
    </div>

    <script>
        // Standardprodukte
        const DEFAULT_PRODUCTS = [
            { name: "Apfel", price: 1.50 },
            { name: "Brot", price: 2.50 },
            { name: "Milch", price: 1.20 },
            { name: "Käse", price: 3.50 },
            { name: "Butter", price: 2.80 },
            { name: "Eier (6)", price: 2.20 },
            { name: "Joghurt", price: 1.80 },
            { name: "Salat", price: 1.50 },
            { name: "Tomate", price: 0.80 }
        ];

        let products = [];
        let selectedPrice = 0;

        // Beim Laden der Seite
        window.addEventListener('load', () => {
            loadProducts();
            renderProductList();
            renderButtons();
            updateDisplay("Wähle ein Produkt");
        });

        // Produkte laden (aus Speicher oder Standard)
        function loadProducts() {
            const saved = localStorage.getItem('products');
            if (saved) {
                products = JSON.parse(saved);
            } else {
                products = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
            }
        }

        // Produkte speichern
        function saveProducts() {
            // Werte aus Eingabefeldern lesen
            const inputs = document.querySelectorAll('.product-item input');
            products = [];
            
            let valid = true;
            inputs.forEach((input, index) => {
                if (index % 2 === 0) {
                    const name = input.value.trim();
                    const priceInput = inputs[index + 1];
                    const price = parseFloat(priceInput.value);
                    
                    if (!name || isNaN(price) || price < 0) {
                        alert(`Produkt ${Math.floor(index / 2) + 1}: Name und Preis erforderlich!`);
                        valid = false;
                        return;
                    }
                    
                    products.push({ name, price });
                }
            });

            if (valid) {
                localStorage.setItem('products', JSON.stringify(products));
                renderButtons();
                alert('✅ Produkte gespeichert!');
            }
        }

        // Produkt-Liste rendern (zum Bearbeiten)
        function renderProductList() {
            const list = document.getElementById('productList');
            list.innerHTML = '';

            products.forEach((product, index) => {
                const item = document.createElement('div');
                item.className = 'product-item';
                item.innerHTML = `
                    <input type="text" value="${product.name}" placeholder="Name">
                    <input type="number" value="${product.price}" placeholder="Preis" step="0.01" min="0">
                    <button onclick="deleteProduct(${index})">❌</button>
                `;
                list.appendChild(item);
            });
        }

        // Produkt löschen
        function deleteProduct(index) {
            products.splice(index, 1);
            renderProductList();
            renderButtons();
        }

        // Buttons rendern (1-9)
        function renderButtons() {
            const grid = document.getElementById('buttonsGrid');
            grid.innerHTML = '';

            for (let i = 0; i < 9; i++) {
                const button = document.createElement('button');
                button.className = 'btn-product';
                
                if (i < products.length) {
                    const product = products[i];
                    button.innerHTML = `
                        <span class="name">${i + 1}. ${product.name}</span>
                        <span class="price">${product.price.toFixed(2)}€</span>
                    `;
                    button.onclick = () => selectProduct(product.price, product.name);
                } else {
                    button.innerHTML = `<span class="name">${i + 1}</span><span class="price">-</span>`;
                    button.style.opacity = '0.5';
                    button.disabled = true;
                }
                
                grid.appendChild(button);
            }
        }

        // Produkt auswählen
        function selectProduct(price, name) {
            selectedPrice = price;
            updateDisplay(`${name}<br>${price.toFixed(2)}€`);
            document.getElementById('paymentInput').value = '';
            document.getElementById('result').innerHTML = '';
        }

        // Schnell-Eingabe
        function quickInput(amount) {
            document.getElementById('paymentInput').value = amount.toFixed(2);
            calculateChange();
        }

        // Rückgeld berechnen
        function calculateChange() {
            const payment = parseFloat(document.getElementById('paymentInput').value);
            const resultDiv = document.getElementById('result');

            if (selectedPrice === 0) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = '⚠️ Wähle zuerst ein Produkt!';
                return;
            }

            if (isNaN(payment) || payment === '') {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = '⚠️ Gib einen Betrag ein!';
                return;
            }

            if (payment < selectedPrice) {
                resultDiv.className = 'result error';
                const missing = (selectedPrice - payment).toFixed(2);
                resultDiv.innerHTML = `❌ Zu wenig!<br>Es fehlen ${missing}€`;
                return;
            }

            const change = payment - selectedPrice;
            resultDiv.className = 'result';
            resultDiv.innerHTML = `
                ✅ Verkauft!<br>
                Preis: ${selectedPrice.toFixed(2)}€<br>
                Bezahlt: ${payment.toFixed(2)}€<br>
                <strong>Rückgeld: ${change.toFixed(2)}€</strong>
            `;
        }

        // Kasse zurücksetzen
        function resetCash() {
            selectedPrice = 0;
            document.getElementById('paymentInput').value = '';
            document.getElementById('result').innerHTML = '';
            updateDisplay("Wähle ein Produkt");
        }

        // Auf Standard zurücksetzen
        function resetToDefault() {
            if (confirm('Alle Produkte auf Standard zurücksetzen?')) {
                products = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
                localStorage.removeItem('products');
                renderProductList();
                renderButtons();
                alert('✅ Auf Standard zurückgesetzt!');
            }
        }

        // Display Update
        function updateDisplay(text) {
            document.getElementById('display').innerHTML = text;
        }

        // Enter-Taste für Berechnung
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('paymentInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') calculateChange();
            });
        });
    </script>
</body>
</html>
