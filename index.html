<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Kasse JKG 7.1 Made by Trubblemaker</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body {
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            flex: 1;
            min-height: 0;
        }

        .section {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            min-height: 0;
        }

        h2 {
            color: #333;
            margin-bottom: 12px;
            font-size: 24px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 8px;
        }

        h3 {
            color: #555;
            margin-top: 12px;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .product-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
        }

        .product-item {
            display: grid;
            grid-template-columns: 1fr 1fr 0.4fr;
            gap: 8px;
            align-items: center;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
            border: 2px solid #ddd;
        }

        .product-item input {
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .product-item button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .product-item button:active {
            background: #ff5252;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
            flex: 1;
            overflow-y: auto;
        }

        .btn-product {
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            background: #667eea;
            min-height: 85px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .btn-product:active {
            transform: scale(0.95);
        }

        .btn-product .name {
            font-size: 15px;
            margin-bottom: 5px;
        }

        .btn-product .price {
            font-size: 13px;
            opacity: 0.9;
        }

        .display {
            background: #333;
            color: #0f0;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            margin-bottom: 12px;
            min-height: 70px;
            font-size: 20px;
            text-align: center;
            word-wrap: break-word;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-display {
            background: #f0f0f0;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 2px solid #ddd;
            max-height: 150px;
            overflow-y: auto;
            min-height: 50px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background: white;
            border-radius: 5px;
            margin-bottom: 5px;
            border-left: 4px solid #667eea;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: bold;
            font-size: 14px;
        }

        .cart-item-qty {
            font-size: 12px;
            color: #666;
        }

        .cart-item-buttons {
            display: flex;
            gap: 5px;
        }

        .cart-item-buttons button {
            padding: 4px 8px;
            font-size: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-qty-btn {
            background: #667eea;
            color: white;
        }

        .cart-qty-btn:active {
            background: #764ba2;
        }

        .cart-remove-btn {
            background: #ff6b6b;
            color: white;
        }

        .cart-remove-btn:active {
            background: #ff5252;
        }

        .quantity-control {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            align-items: center;
            justify-content: center;
        }

        .quantity-control button {
            padding: 10px 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            min-width: 50px;
        }

        .quantity-control button:active {
            background: #764ba2;
        }

        .quantity-display {
            padding: 10px 20px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            min-width: 100px;
            text-align: center;
        }

        .quick-buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .btn-quick {
            padding: 12px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-quick:active {
            background: #e68900;
            transform: scale(0.95);
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .input-group input {
            flex: 1;
            padding: 12px;
            border: 3px solid #667eea;
            border-radius: 8px;
            font-size: 20px;
        }

        .input-group button {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            min-width: 100px;
        }

        .input-group button:active {
            background: #764ba2;
        }

        .result {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #4caf50;
            font-size: 18px;
            text-align: center;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-weight: bold;
        }

        .result.error {
            background: #ffebee;
            border-left-color: #f44336;
            color: #c62828;
        }

        .total-price {
            background: #667eea;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 12px;
        }

        .reset-btn {
            width: 100%;
            padding: 12px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-top: auto;
        }

        .reset-btn:active {
            background: #e68900;
        }

        .add-to-cart-btn {
            width: 100%;
            padding: 12px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .add-to-cart-btn:active {
            background: #45a049;
        }

        .save-btn {
            width: 100%;
            padding: 12px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .save-btn:active {
            background: #45a049;
        }

        .right-section-top {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .cart-empty {
            color: #999;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        @supports (padding: max(0px)) {
            body {
                padding-left: max(10px, env(safe-area-inset-left));
                padding-right: max(10px, env(safe-area-inset-right));
                padding-top: max(10px, env(safe-area-inset-top));
                padding-bottom: max(10px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Linke Seite: Produkte einstellen -->
        <div class="section">
            <h2>⚙️ Einstellungen</h2>
            <button class="save-btn" onclick="saveProducts()">💾</button>
            
            <div class="product-list" id="productList"></div>
            
            <button class="reset-btn" onclick="resetToDefault()">Reset</button>
        </div>

        <!-- Rechte Seite: Kasse -->
        <div class="section">
            <div class="right-section-top">
                <h2>💰 Kasse 7.1</h2>
                
                <h3>Produkte:</h3>
                <div class="buttons-grid" id="buttonsGrid"></div>

                <h3>Menge:</h3>
                <div class="quantity-control">
                    <button onclick="decreaseQuantity()">➖</button>
                    <div class="quantity-display" id="quantityDisplay">1</div>
                    <button onclick="increaseQuantity()">➕</button>
                </div>

                <button class="add-to-cart-btn" onclick="addToCart()">➕ Zum Warenkorb</button>

                <h3>Warenkorb:</h3>
                <div class="cart-display" id="cartDisplay">
                    <div class="cart-empty">Der Warenkorb ist leer</div>
                </div>

                <div class="total-price" id="totalPrice">Gesamt: 0.00€</div>

                <h3>Rückgeld:</h3>
                <div class="quick-buttons">
                    <button class="btn-quick" onclick="quickInput(0.50)">0.50€</button>
                    <button class="btn-quick" onclick="quickInput(1.00)">1.00€</button>
                    <button class="btn-quick" onclick="quickInput(1.50)">1.50€</button>
                    <button class="btn-quick" onclick="quickInput(2.00)">2.00€</button>
                    <button class="btn-quick" onclick="quickInput(2.50)">2.50€</button>
                </div>

                <div class="input-group">
                    <input type="number" id="paymentInput" placeholder="Geld" step="0.01" min="0">
                    <button onclick="calculateChange()">OK</button>
                </div>

                <div class="result" id="result"></div>
            </div>

            <button class="reset-btn" onclick="resetCart()">🔄 Reset</button>
        </div>
    </div>

    <script>
        const DEFAULT_PRODUCTS = [
            { name: "Capri-Sun Ice Pops", price: 0.50 },
            { name: "Alaska Boy Icesticks cola", price: 0.50 },
            { name: "hitschies Saure Drachenzungen blau", price: 0.50 },
            { name: "Alaska Boy Icesticks Sauer", price: 0.50 },
            { name: "Bussy Ice Pops Saurer Apfel", price: 0.50 },
            { name: "Cool Sticks zuckerfrei", price: 0.50 },
            { name: "hitschies Saure Drachenzungen bunt", price: 0.50 },
            { name: "Chupa Chups Squeezee Freeze C&L", price: 0.50 },
            { name: "Sun Lolly Erdbeere", price: 0.50 }
        ];

        let products = [];
        let selectedPrice = 0;
        let selectedName = "";
        let selectedIndex = -1;
        let quantity = 1;
        let cart = [];

        window.addEventListener('load', () => {
            loadProducts();
            renderProductList();
            renderButtons();
            renderCart();
        });

        function loadProducts() {
            const saved = localStorage.getItem('products');
            products = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
        }

        function saveProducts() {
            const inputs = document.querySelectorAll('.product-item input');
            products = [];
            let valid = true;

            inputs.forEach((input, index) => {
                if (index % 2 === 0) {
                    const name = input.value.trim();
                    const price = parseFloat(inputs[index + 1].value);
                    
                    if (!name || isNaN(price) || price < 0) {
                        alert(`Produkt ${Math.floor(index / 2) + 1}: Name und Preis!`);
                        valid = false;
                        return;
                    }
                    products.push({ name, price });
                }
            });

            if (valid) {
                localStorage.setItem('products', JSON.stringify(products));
                renderButtons();
                alert('✅ Saved');
            }
        }

        function renderProductList() {
            const list = document.getElementById('productList');
            list.innerHTML = '';
            products.forEach((product, index) => {
                const item = document.createElement('div');
                item.className = 'product-item';
                item.innerHTML = `
                    <input type="text" value="${product.name}">
                    <input type="number" value="${product.price}" step="0.01">
                    <button onclick="deleteProduct(${index})">❌</button>
                `;
                list.appendChild(item);
            });
        }

        function deleteProduct(index) {
            products.splice(index, 1);
            renderProductList();
            renderButtons();
        }

        function renderButtons() {
            const grid = document.getElementById('buttonsGrid');
            grid.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const button = document.createElement('button');
                button.className = 'btn-product';
                
                if (i < products.length) {
                    const product = products[i];
                    button.innerHTML = `<span class="name">${i + 1}. ${product.name}</span><span class="price">${product.price.toFixed(2)}€</span>`;
                    button.onclick = () => selectProduct(i, product.price, product.name);
                } else {
                    button.innerHTML = `<span class="name">${i + 1}</span>`;
                    button.style.opacity = '0.5';
                    button.disabled = true;
                }
                grid.appendChild(button);
            }
        }

        function selectProduct(index, price, name) {
            selectedPrice = price;
            selectedName = name;
            selectedIndex = index;
            quantity = 1;
            updateQuantityDisplay();
        }

        function increaseQuantity() {
            if (selectedPrice > 0) {
                quantity++;
                updateQuantityDisplay();
            }
        }

        function decreaseQuantity() {
            if (selectedPrice > 0 && quantity > 1) {
                quantity--;
                updateQuantityDisplay();
            }
        }

        function updateQuantityDisplay() {
            document.getElementById('quantityDisplay').textContent = quantity;
        }

        function addToCart() {
            if (selectedPrice === 0) {
                alert('⚠️ Produkt wählen!');
                return;
            }

            // Check if product already in cart
            const existingItem = cart.find(item => item.name === selectedName);
            if (existingItem) {
                existingItem.quantity += quantity;
            } else {
                cart.push({
                    name: selectedName,
                    price: selectedPrice,
                    quantity: quantity
                });
            }

            quantity = 1;
            updateQuantityDisplay();
            renderCart();
            document.getElementById('result').innerHTML = '';
            document.getElementById('paymentInput').value = '';
        }

        function renderCart() {
            const cartDiv = document.getElementById('cartDisplay');
            const totalPriceDiv = document.getElementById('totalPrice');

            if (cart.length === 0) {
                cartDiv.innerHTML = '<div class="cart-empty">Der Warenkorb ist leer</div>';
                totalPriceDiv.innerHTML = 'Gesamt: 0.00€';
                return;
            }

            let total = 0;
            cartDiv.innerHTML = '';

            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;

                const cartItem = document.createElement('div');
                cartItem.className = 'cart-item';
                cartItem.innerHTML = `
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-qty">${item.quantity}x ${item.price.toFixed(2)}€ = ${itemTotal.toFixed(2)}€</div>
                    </div>
                    <div class="cart-item-buttons">
                        <button class="cart-qty-btn" onclick="changeCartQuantity(${index}, 1)">➕</button>
                        <button class="cart-qty-btn" onclick="changeCartQuantity(${index}, -1)">➖</button>
                        <button class="cart-remove-btn" onclick="removeFromCart(${index})">❌</button>
                    </div>
                `;
                cartDiv.appendChild(cartItem);
            });

            totalPriceDiv.innerHTML = `Gesamt: ${total.toFixed(2)}€`;
        }

        function changeCartQuantity(index, change) {
            cart[index].quantity += change;
            if (cart[index].quantity <= 0) {
                removeFromCart(index);
            } else {
                renderCart();
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
        }

        function quickInput(amount) {
            document.getElementById('paymentInput').value = amount.toFixed(2);
            calculateChange();
        }

        function calculateChange() {
            const payment = parseFloat(document.getElementById('paymentInput').value);
            const resultDiv = document.getElementById('result');

            if (cart.length === 0) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = '⚠️ Warenkorb leer!';
                return;
            }

            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            if (isNaN(payment) || payment === '') {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = '⚠️ Geld eingeben!';
                return;
            }

            if (payment < totalPrice) {
                resultDiv.className = 'result error';
                const missing = (totalPrice - payment).toFixed(2);
                resultDiv.innerHTML = `❌ Zu wenig!<br>${missing}€ fehlt`;
                return;
            }

            const change = payment - totalPrice;
            resultDiv.className = 'result';
            resultDiv.innerHTML = `✅ OK!<br>Preis: <strong>${totalPrice.toFixed(2)}€</strong><br>Rückgeld: <strong>${change.toFixed(2)}€</strong>`;
        }

        function resetCart() {
            if (confirm('Warenkorb leeren?')) {
                cart = [];
                quantity = 1;
                selectedPrice = 0;
                selectedName = "";
                selectedIndex = -1;
                document.getElementById('paymentInput').value = '';
                document.getElementById('result').innerHTML = '';
                document.getElementById('quantityDisplay').textContent = '1';
                renderCart();
            }
        }

        function resetToDefault() {
            if (confirm('Auf Standard zurücksetzen?')) {
                products = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
                localStorage.removeItem('products');
                renderProductList();
                renderButtons();
                alert('✅ Reset!');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('paymentInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') calculateChange();
            });
        });
    </script>
</body>
</html>
