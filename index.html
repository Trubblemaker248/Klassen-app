<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Kasse JKG 7.1 Made by Trubblemaker</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body {
            display: flex;
            flex-direction: row;
            padding: 0;
            gap: 0;
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        .sidebar {
            width: 280px;
            background: white;
            border-radius: 12px;
            padding: 12px;
            margin: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            height: calc(100vh - 20px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
        }

        .sidebar-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sidebar-title {
            font-weight: bold;
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            margin-top: 8px;
        }

        .tab-button {
            padding: 14px;
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            color: #333;
            transition: all 0.3s;
            text-align: left;
        }

        .tab-button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .tab-button:active {
            transform: scale(0.95);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            padding-right: 10px;
            min-height: 0;
            overflow: hidden;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            flex: 1;
            min-height: 0;
        }

        .section {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: none;
            flex-direction: column;
            overflow-y: auto;
            min-height: 0;
        }

        .section.active {
            display: flex;
        }

        .section-full {
            grid-column: 1 / -1;
        }

        h2 {
            color: #333;
            margin-bottom: 12px;
            font-size: 24px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 8px;
            flex-shrink: 0;
        }

        h3 {
            color: #555;
            margin-top: 12px;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .product-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
        }

        .product-item {
            display: grid;
            grid-template-columns: 1.5fr 1fr 0.4fr;
            gap: 8px;
            align-items: center;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
            border: 2px solid #ddd;
            flex-shrink: 0;
        }

        .product-item input {
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .product-item button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .product-item button:active {
            background: #ff5252;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
            flex: 1;
            overflow-y: auto;
            align-content: start;
        }

        .btn-product {
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            background: #667eea;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .btn-product:active {
            transform: scale(0.95);
        }

        .btn-product .name {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .btn-product .price {
            font-size: 12px;
            opacity: 0.9;
        }

        .cart-display {
            background: #f0f0f0;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            border: 2px solid #ddd;
            overflow-y: auto;
            min-height: 50px;
            flex: 1;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            background: white;
            border-radius: 5px;
            margin-bottom: 5px;
            border-left: 4px solid #667eea;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: bold;
            font-size: 14px;
        }

        .cart-item-qty {
            font-size: 12px;
            color: #666;
        }

        .cart-item-buttons {
            display: flex;
            gap: 5px;
        }

        .cart-item-buttons button {
            padding: 4px 8px;
            font-size: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-qty-btn {
            background: #667eea;
            color: white;
        }

        .cart-qty-btn:active {
            background: #764ba2;
        }

        .cart-remove-btn {
            background: #ff6b6b;
            color: white;
        }

        .cart-remove-btn:active {
            background: #ff5252;
        }

        .quick-buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .btn-quick {
            padding: 12px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-quick:active {
            background: #e68900;
            transform: scale(0.95);
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .input-group input {
            flex: 1;
            padding: 12px;
            border: 3px solid #667eea;
            border-radius: 8px;
            font-size: 20px;
        }

        .input-group button {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            min-width: 100px;
        }

        .input-group button:active {
            background: #764ba2;
        }

        .result {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #4caf50;
            font-size: 18px;
            text-align: center;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .result.error {
            background: #ffebee;
            border-left-color: #f44336;
            color: #c62828;
        }

        .total-price {
            background: #667eea;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 12px;
            flex-shrink: 0;
        }

        .reset-btn {
            width: 100%;
            padding: 12px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            flex-shrink: 0;
        }

        .reset-btn:active {
            background: #e68900;
        }

        .save-btn {
            width: 100%;
            padding: 12px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .save-btn:active {
            background: #45a049;
        }

        .cart-empty {
            color: #999;
            text-align: center;
            padding: 20px;
            font-size: 14px;
        }

        @media (max-width: 1024px) {
            .sidebar {
                width: 240px;
            }

            .buttons-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .content-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Linke Sidebar: Tabs & Einstellungen -->
    <div class="sidebar">
        <div class="sidebar-section">
            <div class="sidebar-title">Navigation</div>
            <button class="tab-button active" onclick="switchTab(0)">⚙️ Einstellungen</button>
            <button class="tab-button" onclick="switchTab(1)">🛒 Warenkorb</button>
        </div>

        <div class="sidebar-section" id="settingsPanel" style="flex: 1; overflow-y: auto;">
            <div class="sidebar-title">Produkte verwalten</div>
            <button class="save-btn" onclick="saveProducts()">💾 Speichern</button>
            <div class="product-list" id="productList"></div>
            <button class="reset-btn" onclick="resetToDefault()">Reset</button>
        </div>
    </div>

    <!-- Rechte Seite: Haupt-Content -->
    <div class="main-content">
        <!-- Content Grid: Warenkorb & Kasse -->
        <div class="content-grid">
            <!-- Warenkorb -->
            <div class="section active" id="tab-1">
                <h2>🛒 Warenkorb</h2>
                
                <h3>Produkte:</h3>
                <div class="buttons-grid" id="buttonsGrid"></div>

                <h3>Warenkorb:</h3>
                <div class="cart-display" id="cartDisplay">
                    <div class="cart-empty">Der Warenkorb ist leer</div>
                </div>

                <div class="total-price" id="totalPrice">Gesamt: 0.00€</div>

                <button class="reset-btn" onclick="resetCart()">🔄 Leeren</button>
            </div>

            <!-- Kasse -->
            <div class="section active" id="tab-kasse">
                <h2>💰 Kasse 7.1</h2>

                <h3>Rückgeld:</h3>
                <div class="quick-buttons">
                    <button class="btn-quick" onclick="quickInput(0.50)">0.50€</button>
                    <button class="btn-quick" onclick="quickInput(1.00)">1.00€</button>
                    <button class="btn-quick" onclick="quickInput(1.50)">1.50€</button>
                    <button class="btn-quick" onclick="quickInput(2.00)">2.00€</button>
                    <button class="btn-quick" onclick="quickInput(2.50)">2.50€</button>
                </div>

                <div class="input-group">
                    <input type="number" id="paymentInput" placeholder="Geld" step="0.01" min="0">
                    <button onclick="calculateChange()">OK</button>
                </div>

                <div class="result" id="result"></div>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_PRODUCTS = [
            { name: "Capri-Sun Ice Pops", price: 0.50 },
            { name: "Alaska Boy Icesticks cola", price: 0.50 },
            { name: "hitschies Saure Drachenzungen blau", price: 0.50 },
            { name: "Alaska Boy Icesticks Sauer", price: 0.50 },
            { name: "Bussy Ice Pops Saurer Apfel", price: 0.50 },
            { name: "Cool Sticks zuckerfrei", price: 0.50 },
            { name: "hitschies Saure Drachenzungen bunt", price: 0.50 },
            { name: "Chupa Chups Squeezee Freeze C&L", price: 0.50 },
            { name: "Sun Lolly Erdbeere", price: 0.50 }
        ];

        let products = [];
        let cart = [];

        window.addEventListener('load', () => {
            loadProducts();
            renderProductList();
            renderButtons();
            renderCart();
        });

        function switchTab(tabIndex) {
            const settingsPanel = document.getElementById('settingsPanel');
            
            if (tabIndex === 0) {
                // Einstellungen anzeigen
                settingsPanel.style.display = 'flex';
                settingsPanel.style.flexDirection = 'column';
            } else {
                // Einstellungen verstecken
                settingsPanel.style.display = 'none';
            }

            // Tab-Button-Status aktualisieren
            document.querySelectorAll('.tab-button').forEach((button, index) => {
                if (index < 2) {
                    button.classList.toggle('active', index === tabIndex);
                }
            });
        }

        function loadProducts() {
            const saved = localStorage.getItem('products');
            products = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
        }

        function saveProducts() {
            const inputs = document.querySelectorAll('.product-item input');
            products = [];
            let valid = true;

            inputs.forEach((input, index) => {
                if (index % 2 === 0) {
                    const name = input.value.trim();
                    const price = parseFloat(inputs[index + 1].value);
                    
                    if (!name || isNaN(price) || price < 0) {
                        alert(`Produkt ${Math.floor(index / 2) + 1}: Name und Preis!`);
                        valid = false;
                        return;
                    }
                    products.push({ name, price });
                }
            });

            if (valid) {
                localStorage.setItem('products', JSON.stringify(products));
                renderButtons();
                alert('✅ Saved');
            }
        }

        function renderProductList() {
            const list = document.getElementById('productList');
            list.innerHTML = '';
            products.forEach((product, index) => {
                const item = document.createElement('div');
                item.className = 'product-item';
                item.innerHTML = `
                    <input type="text" value="${product.name}">
                    <input type="number" value="${product.price}" step="0.01">
                    <button onclick="deleteProduct(${index})">❌</button>
                `;
                list.appendChild(item);
            });
        }

        function deleteProduct(index) {
            products.splice(index, 1);
            renderProductList();
            renderButtons();
        }

        function renderButtons() {
            const grid = document.getElementById('buttonsGrid');
            grid.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const button = document.createElement('button');
                button.className = 'btn-product';
                
                if (i < products.length) {
                    const product = products[i];
                    button.innerHTML = `<span class="name">${i + 1}. ${product.name}</span><span class="price">${product.price.toFixed(2)}€</span>`;
                    button.onclick = () => addToCartDirect(product.name, product.price);
                } else {
                    button.innerHTML = `<span class="name">${i + 1}</span>`;
                    button.style.opacity = '0.5';
                    button.disabled = true;
                }
                grid.appendChild(button);
            }
        }

        function addToCartDirect(name, price) {
            const existingItem = cart.find(item => item.name === name);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({
                    name: name,
                    price: price,
                    quantity: 1
                });
            }

            renderCart();
            document.getElementById('result').innerHTML = '';
            document.getElementById('paymentInput').value = '';
        }

        function renderCart() {
            const cartDiv = document.getElementById('cartDisplay');
            const totalPriceDiv = document.getElementById('totalPrice');

            if (cart.length === 0) {
                cartDiv.innerHTML = '<div class="cart-empty">Der Warenkorb ist leer</div>';
                totalPriceDiv.innerHTML = 'Gesamt: 0.00€';
                return;
            }

            let total = 0;
            cartDiv.innerHTML = '';

            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;

                const cartItem = document.createElement('div');
                cartItem.className = 'cart-item';
                cartItem.innerHTML = `
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-qty">${item.quantity}x ${item.price.toFixed(2)}€ = ${itemTotal.toFixed(2)}€</div>
                    </div>
                    <div class="cart-item-buttons">
                        <button class="cart-qty-btn" onclick="changeCartQuantity(${index}, 1)">➕</button>
                        <button class="cart-qty-btn" onclick="changeCartQuantity(${index}, -1)">➖</button>
                        <button class="cart-remove-btn" onclick="removeFromCart(${index})">❌</button>
                    </div>
                `;
                cartDiv.appendChild(cartItem);
            });

            totalPriceDiv.innerHTML = `Gesamt: ${total.toFixed(2)}€`;
        }

        function changeCartQuantity(index, change) {
            cart[index].quantity += change;
            if (cart[index].quantity <= 0) {
                removeFromCart(index);
            } else {
                renderCart();
            }
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
        }

        function quickInput(amount) {
            document.getElementById('paymentInput').value = amount.toFixed(2);
            calculateChange();
        }

        function calculateChange() {
            const payment = parseFloat(document.getElementById('paymentInput').value);
            const resultDiv = document.getElementById('result');

            if (cart.length === 0) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = '⚠️ Warenkorb leer!';
                return;
            }

            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            if (isNaN(payment) || payment === '') {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = '⚠️ Geld eingeben!';
                return;
            }

            if (payment < totalPrice) {
                resultDiv.className = 'result error';
                const missing = (totalPrice - payment).toFixed(2);
                resultDiv.innerHTML = `❌ Zu wenig!<br>${missing}€ fehlt`;
                return;
            }

            const change = payment - totalPrice;
            resultDiv.className = 'result';
            resultDiv.innerHTML = `✅ OK!<br>Preis: <strong>${totalPrice.toFixed(2)}€</strong><br>Rückgeld: <strong>${change.toFixed(2)}€</strong>`;
        }

        function resetCart() {
            if (confirm('Warenkorb leeren?')) {
                cart = [];
                document.getElementById('paymentInput').value = '';
                document.getElementById('result').innerHTML = '';
                renderCart();
            }
        }

        function resetToDefault() {
            if (confirm('Auf Standard zurücksetzen?')) {
                products = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
                localStorage.removeItem('products');
                renderProductList();
                renderButtons();
                alert('✅ Reset!');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('paymentInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') calculateChange();
            });
        });
    </script>
</body>
</html>
