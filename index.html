<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Kasse JKG 7.1 Made by Trubblemaker</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        body {
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            flex: 1;
            min-height: 0;
        }

        .section {
            background: white;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            min-height: 0;
        }

        h2 {
            color: #333;
            margin-bottom: 12px;
            font-size: 24px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 8px;
        }

        h3 {
            color: #555;
            margin-top: 12px;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .product-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
            overflow-y: auto;
        }

        .product-item {
            display: grid;
            grid-template-columns: 1fr 1fr 0.4fr;
            gap: 8px;
            align-items: center;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 8px;
            border: 2px solid #ddd;
        }

        .product-item input {
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .product-item button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .product-item button:active {
            background: #ff5252;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .btn-product {
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            background: #667eea;
            min-height: 85px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .btn-product:active {
            transform: scale(0.95);
        }

        .btn-product .name {
            font-size: 15px;
            margin-bottom: 5px;
        }

        .btn-product .price {
            font-size: 13px;
            opacity: 0.9;
        }

        .display {
            background: #333;
            color: #0f0;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            margin-bottom: 12px;
            min-height: 70px;
            font-size: 24px;
            text-align: center;
            word-wrap: break-word;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quick-buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .btn-quick {
            padding: 12px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-quick:active {
            background: #e68900;
            transform: scale(0.95);
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .input-group input {
            flex: 1;
            padding: 12px;
            border: 3px solid #667eea;
            border-radius: 8px;
            font-size: 20px;
        }

        .input-group button {
            padding: 12px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            min-width: 100px;
        }

        .input-group button:active {
            background: #764ba2;
        }

        .result {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #4caf50;
            font-size: 18px;
            text-align: center;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-weight: bold;
        }

        .result.error {
            background: #ffebee;
            border-left-color: #f44336;
            color: #c62828;
        }

        .reset-btn {
            width: 100%;
            padding: 12px;
            background: #ff9800;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
        }

        .reset-btn:active {
            background: #e68900;
        }

        .save-btn {
            width: 100%;
            padding: 12px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .save-btn:active {
            background: #45a049;
        }

        @supports (padding: max(0px)) {
            body {
                padding-left: max(10px, env(safe-area-inset-left));
                padding-right: max(10px, env(safe-area-inset-right));
                padding-top: max(10px, env(safe-area-inset-top));
                padding-bottom: max(10px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Linke Seite: Produkte einstellen -->
        <div class="section">
            <h2>⚙️ Einstellungen</h2>
            <button class="save-btn" onclick="saveProducts()">💾</button>
            
            <div class="product-list" id="productList"></div>
            
            <button class="reset-btn" onclick="resetToDefault()">Reset</button>
        </div>

        <!-- Rechte Seite: Kasse -->
        <div class="section">
            <h2>💰 Kasse 7.1</h2>
            
            <div class="display" id="display">%% Produkt wählen %%</div>

            <h3>Produkte:</h3>
            <div class="buttons-grid" id="buttonsGrid"></div>

            <h3>Rückgeld:</h3>
            <div class="quick-buttons">
                <button class="btn-quick" onclick="quickInput(0.50)">0.50€</button>
                <button class="btn-quick" onclick="quickInput(1.00)">1.00€</button>
                <button class="btn-quick" onclick="quickInput(1.50)">1.50€</button>
                <button class="btn-quick" onclick="quickInput(2.00)">2.00€</button>
                <button class="btn-quick" onclick="quickInput(2.50)">2.50€</button>
            </div>

            <div class="input-group">
                <input type="number" id="paymentInput" placeholder="Geld" step="0.01" min="0">
                <button onclick="calculateChange()">OK</button>
            </div>

            <div class="result" id="result"></div>

            <button class="reset-btn" onclick="resetCash()">🔄</button>
        </div>
    </div>

    <script>
        const DEFAULT_PRODUCTS = [
            { name: "Capri-Sun Ice Pops", price: 0.50 },
            { name: "Alaska Boy Icesticks cola", price: 0.50 },
            { name: "hitschies Saure Drachenzungen blau", price: 0.50 },
            { name: "Alaska Boy Icesticks Sauer", price: 0.50 },
            { name: "Bussy Ice Pops Saurer Apfel", price: 0.50 },
            { name: "Cool Sticks zuckerfrei", price: 0.50 },
            { name: "hitschies Saure Drachenzungen bunt", price: 0.50 },
            { name: "Chupa Chups Squeezee Freeze C&L", price: 0.50 },
            { name: "Sun Lolly Erdbeere", price: 0.50 }
        ];

        let products = [];
        let selectedPrice = 0;

        window.addEventListener('load', () => {
            loadProducts();
            renderProductList();
            renderButtons();
            updateDisplay("%% Produkt wählen %%");
        });

        function loadProducts() {
            const saved = localStorage.getItem('products');
            products = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
        }

        function saveProducts() {
            const inputs = document.querySelectorAll('.product-item input');
            products = [];
            let valid = true;

            inputs.forEach((input, index) => {
                if (index % 2 === 0) {
                    const name = input.value.trim();
                    const price = parseFloat(inputs[index + 1].value);
                    
                    if (!name || isNaN(price) || price < 0) {
                        alert(`Produkt ${Math.floor(index / 2) + 1}: Name und Preis!`);
                        valid = false;
                        return;
                    }
                    products.push({ name, price });
                }
            });

            if (valid) {
                localStorage.setItem('products', JSON.stringify(products));
                renderButtons();
                alert('✅ Saved');
                
            }
        }

        function renderProductList() {
            const list = document.getElementById('productList');
            list.innerHTML = '';
            products.forEach((product, index) => {
                const item = document.createElement('div');
                item.className = 'product-item';
                item.innerHTML = `
                    <input type="text" value="${product.name}">
                    <input type="number" value="${product.price}" step="0.01">
                    <button onclick="deleteProduct(${index})">❌</button>
                `;
                list.appendChild(item);
            });
        }

        function deleteProduct(index) {
            products.splice(index, 1);
            renderProductList();
            renderButtons();
        }

        function renderButtons() {
            const grid = document.getElementById('buttonsGrid');
            grid.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const button = document.createElement('button');
                button.className = 'btn-product';
                
                if (i < products.length) {
                    const product = products[i];
                    button.innerHTML = `<span class="name">${i + 1}. ${product.name}</span><span class="price">${product.price.toFixed(2)}€</span>`;
                    button.onclick = () => selectProduct(product.price, product.name);
                } else {
                    button.innerHTML = `<span class="name">${i + 1}</span>`;
                    button.style.opacity = '0.5';
                    button.disabled = true;
                }
                grid.appendChild(button);
            }
        }

        function selectProduct(price, name) {
            selectedPrice = price;
            updateDisplay(`${name}<br>${price.toFixed(2)}€`);
            document.getElementById('paymentInput').value = '';
            document.getElementById('result').innerHTML = '';
        }

        function quickInput(amount) {
            document.getElementById('paymentInput').value = amount.toFixed(2);
            calculateChange();
        }

        function calculateChange() {
            const payment = parseFloat(document.getElementById('paymentInput').value);
            const resultDiv = document.getElementById('result');

            if (selectedPrice === 0) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = '⚠️ Produkt wählen!';
                return;
            }

            if (isNaN(payment) || payment === '') {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = '⚠️ Geld eingeben!';
                return;
            }

            if (payment < selectedPrice) {
                resultDiv.className = 'result error';
                const missing = (selectedPrice - payment).toFixed(2);
                resultDiv.innerHTML = `❌ Zu wenig!<br>${missing}€ fehlt`;
                return;
            }

            const change = payment - selectedPrice;
            resultDiv.className = 'result';
            resultDiv.innerHTML = `✅ OK!<br>Rückgeld: <strong>${change.toFixed(2)}€</strong>`;
        }

        function resetCash() {
            selectedPrice = 0;
            document.getElementById('paymentInput').value = '';
            document.getElementById('result').innerHTML = '';
            updateDisplay("Produkt wählen");
        }

        function resetToDefault() {
            if (confirm('Auf Standard zurücksetzen?')) {
                products = JSON.parse(JSON.stringify(DEFAULT_PRODUCTS));
                localStorage.removeItem('products');
                renderProductList();
                renderButtons();
                alert('✅ Reset!');
                alert('load. press okay to close')
            }
        }

        function updateDisplay(text) {
            document.getElementById('display').innerHTML = text;
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('paymentInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') calculateChange();
            });
        });
    </script>
</body>
</html>
